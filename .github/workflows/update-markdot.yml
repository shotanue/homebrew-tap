name: Update markdot

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Get latest release version
        id: release
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/shotanue/markdot/releases/latest | jq -r .tag_name)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${VERSION}"

      - name: Check if update is needed
        id: check
        run: |
          CURRENT=$(grep "version " Formula/markdot.rb | head -1 | sed "s/.*version '\\(.*\\)'/\\1/")
          echo "Current: ${CURRENT}"
          echo "Latest:  ${{ steps.release.outputs.version }}"
          if [ "${CURRENT}" = "${{ steps.release.outputs.version }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download binaries and compute SHA256
        if: steps.check.outputs.skip != 'true'
        id: sha
        run: |
          BASE="https://github.com/shotanue/markdot/releases/download/${{ steps.release.outputs.version }}"
          curl -fSL -o markdot-darwin-amd64 "${BASE}/markdot-darwin-amd64"
          curl -fSL -o markdot-darwin-arm64 "${BASE}/markdot-darwin-arm64"
          curl -fSL -o markdot-linux-amd64  "${BASE}/markdot-linux-amd64"
          echo "darwin_amd64=$(sha256sum markdot-darwin-amd64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_arm64=$(sha256sum markdot-darwin-arm64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(sha256sum markdot-linux-amd64 | cut -d' ' -f1)"   >> "$GITHUB_OUTPUT"

      - name: Update Formula
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA_DARWIN_AMD64: ${{ steps.sha.outputs.darwin_amd64 }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.sha.outputs.linux_amd64 }}
        run: |
          cat > Formula/markdot.rb << RUBY
          class Markdot < Formula
            desc 'Markdown driven dotfiles.'
            version '${VERSION}'
            homepage 'https://github.com/shotanue/markdot'

            on_macos do
              if Hardware::CPU.arm?
                url 'https://github.com/shotanue/markdot/releases/download/${VERSION}/markdot-darwin-arm64'
                sha256 '${SHA_DARWIN_ARM64}'
              end
              if Hardware::CPU.intel?
                url 'https://github.com/shotanue/markdot/releases/download/${VERSION}/markdot-darwin-amd64'
                sha256 '${SHA_DARWIN_AMD64}'
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url 'https://github.com/shotanue/markdot/releases/download/${VERSION}/markdot-linux-amd64'
                sha256 '${SHA_LINUX_AMD64}'
              end
            end

            head do
              url 'https://github.com/shotanue/markdot.git'
            end

            def install
              bin.install Dir["*"].first => "markdot"
            end
          end
          RUBY

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/markdot.rb
          git commit -m "markdot ${{ steps.release.outputs.version }}"
          git push
